name: CI

on:
  push:
  pull_request:
  delete:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test net10.0
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload restore tests/MauiAnimate.Tests/MauiAnimate.Tests.csproj

      - name: Restore
        run: dotnet restore tests/MauiAnimate.Tests/MauiAnimate.Tests.csproj

      - name: Build
        run: |
          dotnet build src/MauiAnimate/MauiAnimate.csproj -c Release -f net10.0 --no-restore
          dotnet build tests/MauiAnimate.Tests/MauiAnimate.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/MauiAnimate.Tests/MauiAnimate.Tests.csproj -c Release --no-build --verbosity normal

  android:
    name: Build Android
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Build library
        run: dotnet build src/MauiAnimate/MauiAnimate.csproj -c Release -f net10.0-android

  ios:
    name: Build iOS
    if: github.event_name != 'delete'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI iOS
        run: dotnet workload install maui-ios

      - name: Build library
        # macOS TargetFrameworks also list android/maccatalyst; restore only iOS
        # so this job does not require those workloads (NETSDK1147).
        run: >
          dotnet build src/MauiAnimate/MauiAnimate.csproj
          -c Release
          -f net10.0-ios
          -p:TargetFrameworks=net10.0-ios

  mirror:
    name: Mirror to GitLab
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Push mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_TOKEN}" ]; then
            echo "Missing secret GITLAB_TOKEN (GitLab PAT or project access token with write_repository)." >&2
            exit 1
          fi

          dest="https://oauth2:${GITLAB_TOKEN}@gitlab.com/olaboutcode/reactor-animate.git"

          git clone --bare "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror.git
          git -C mirror.git push --mirror "${dest}"
