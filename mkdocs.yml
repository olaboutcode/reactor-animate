site_name: Reactor.Animate
site_description: Shared-element page transitions and in-page view motion for MauiReactor
site_url: https://olaboutcode.github.io/reactor-animate/
repo_url: https://github.com/olaboutcode/reactor-animate
repo_name: olaboutcode/reactor-animate
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: MIT

exclude_docs: |
  PLAN.md
  ANIMATE_MOTION.md
  prs/**
  requirements.txt

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Page:
      - Host: page/host.md
      - Heroes: page/heroes.md
      - Navigation: page/navigation.md
      - Transitions: page/transitions.md
      - Events: page/events.md
      - Flights: page/flights.md
      - Platform: page/platform.md
      - Guarantees: page/guarantees.md
  - Motion:
      - Overview: motion/overview.md
      - Recipes: motion/recipes.md
      - Playback: motion/playback.md
      - Composition: motion/composition.md
  - Samples: samples.md
